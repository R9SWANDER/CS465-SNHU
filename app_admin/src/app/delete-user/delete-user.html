<!-- Displays a full page, red bannered and buttoned, to confirm deletion-->

<div class="container mt-4">
    <div *ngIf="!user && !message" class="alert alert-info">
        Loading user details...
    </div>

    <div *ngIf="message" class="alert alert-warning">
        {{ message }}
    </div>

  <div class="card" *ngIf="user">
    <div class="card-header bg-danger text-white">
      Confirm Delete
    </div>
    <div class="card-body">
      <h5>Are you sure you want to delete this user?</h5>
      <p><strong>{{ user.userName }}</strong></p>

      <button class="btn btn-danger me-2" (click)="onDeleteClick()">
        Yes, Delete User
      </button>

      <button class="btn btn-secondary" (click)="router.navigate(['users'])">
        Cancel
      </button>
    </div>
  </div>
</div>

<div *ngIf="message" class="alert alert-warning">
  {{ message }}
</div>
