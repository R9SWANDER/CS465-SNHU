<!-- Displays a full page red bannered and buttoned to confirm deletion-->

<div class="container mt-4">
    <div *ngIf="!trip && !message" class="alert alert-info">
        Loading trip details...
    </div>

    <div *ngIf="message" class="alert alert-warning">
        {{ message }}
    </div>

  <div class="card" *ngIf="trip">
    <div class="card-header bg-danger text-white">
      Confirm Delete
    </div>
    <div class="card-body">
      <h5>Are you sure you want to delete this trip?</h5>
      <p><strong>{{ trip.name }}</strong></p>

      <button class="btn btn-danger me-2" (click)="onDeleteClick()">
        Yes, Delete Trip
      </button>

      <button class="btn btn-secondary" (click)="router.navigate([''])">
        Cancel
      </button>
    </div>
  </div>
</div>

<div *ngIf="message" class="alert alert-warning">
  {{ message }}
</div>
